services:
  assistant-api:
    build:
      context: ../../
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      ASSISTANT_ENVIRONMENT: development
      ASSISTANT_AUTH_ENABLED: "false"
      ASSISTANT_DOCS_ENABLED: "true"
      ASSISTANT_OLLAMA_BASE_URL: http://ollama:11434
      ASSISTANT_DEFAULT_MODEL: deepseek-coder
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
