apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "assistant-api.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "assistant-api.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "assistant-api.name" . }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ quote $v }}
            {{- end }}
            {{- if .Values.secrets.jwtSecretKey }}
            - name: ASSISTANT_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "assistant-api.fullname" . }}-secrets
                  key: jwtSecretKey
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
